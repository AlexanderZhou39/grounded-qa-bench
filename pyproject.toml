[project]
name = "grounded-qa-bench"
version = "0.1.0"
description = "Benchmark harness comparing LLM groundedness / fact-checking approaches on question->answer tasks"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "anthropic>=0.40",
    "openai>=1.50",
    "rapidfuzz>=3.14.6",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bench = "gqb.cli:app"

[project.optional-dependencies]
local = [
    "sentence-transformers>=6.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gqb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
